# Mapping for the real "采购合同" xlsx template.
# Coordinates derived from manual inspection of a real template instance
# (merged cells, item table at rows 9-26, subtotal formulas at row 27,
# RMB-capital line at row 28). The template file itself is never committed.
#
# Most clause paragraphs (质量要求 / 交货地点 / 运输方式 / 结算方式 / 争议解决)
# are genuinely static template boilerplate and are intentionally NOT
# overwritten. Row 40 (违约责任) is NOT purely static, though - it embeds
# the delivery deadline date inline ("6月9日前分批次完成发货……"). A real
# generation run against a real 18-line sample proved that leaving it
# alone lets a PREVIOUS transaction's delivery date leak into a new
# document. Any cell whose content depends on this transaction's facts at
# all - even a single date inside otherwise-static prose - must be listed
# below (in `text`, not silently left as "static"), so the renderer always
# overwrites it.
id: procurement.contract.v1
format: xlsx
sheet: 采购合同

# Fixed A4 print profile - replaces manual "Fit to Page" scaling. scale_percent
# is a calibrated business value: it is the ACTUAL Excel scale the real
# template must print at on A4 for this print_area/paper_size/orientation.
# 70 is a starting point per the initial calibration pass on a real printed
# sample, not a made-up constant - re-measure and adjust it here (not in
# code) whenever the template's layout changes.
print:
  paper_size: A4
  orientation: portrait
  print_area: A1:I49
  scale_percent: 70

header:
  A3: "购方：{buyer}"
  F3: "合同编号：{contract_no}"
  A4: "销方：{seller}"
  A28: "合并（RMB大写）：{amount_in_words}"
  A48: "购方：{buyer}"
  F48: "销方：{seller}"
  A49: "时间：{contract_date}"
  F49: "时间：{contract_date}"

text:
  A40: "{delivery_month_day}前分批次完成发货，每逾期1日，乙方按合同总金额的3%支付违约金；逾期超过7日，甲方有权解除合同并要求赔偿损失。"

# printed_diameter_mm is the seal's target visible diameter ON THE PRINTED
# PAGE, not its size inside the Excel workbook. The renderer inflates it by
# 1 / (print.scale_percent / 100) when embedding the image so it still comes
# out at this diameter once the sheet itself is scaled down for A4.
images:
  buyer_seal:
    anchor: A46
    printed_diameter_mm: 38
    x_offset_px: 8
    y_offset_px: 4
  seller_seal:
    anchor: F46
    printed_diameter_mm: 38
    x_offset_px: 8
    y_offset_px: 4

items:
  start_row: 9
  end_row: 26
  columns:
    sku: A
    product_name: B
    specification: C
    quantity: D
    unit: E
    net_unit_price: F
    net_amount: G
    tax_amount: H
    gross_amount: I
  # Row 27 (小计 = SUM(G9:G26), SUM(H9:H26), SUM(I9:I26)) and I28 (=I27) are
  # native Excel formulas left intact by the renderer; they recalculate
  # automatically once Excel opens the generated file (fullCalcOnLoad).
